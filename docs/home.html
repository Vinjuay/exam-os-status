<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>UTO 대시보드</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#a1a1a6;--line:#e5e5ea;--track:#e8e8ed;
--acc:#0071e3;--acc2:#cfe3fb;--done:#8fb8ea;--good:#248a3d;--bad:#d70015;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--ink2:#a1a1a6;--ink3:#6e6e73;
--line:#2c2c2e;--track:#2c2c2e;--acc:#2997ff;--acc2:#12375e;--done:#1f4f80;--good:#32d74b;--bad:#ff6961;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
letter-spacing:-.01em;padding:20px 16px 28px;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border-radius:20px;padding:22px 24px}
h2{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 14px;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.hero b{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.hero .sub{color:var(--ink2);font-size:14px;text-align:right}
.hero .sub strong{display:block;color:var(--ink);font-size:17px;font-weight:600}
svg{display:block;width:100%;height:auto}
.lap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin:18px 0 10px}
.lap strong{font-size:20px;letter-spacing:-.02em}
.lap span{color:var(--ink2);font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.crit{display:grid;gap:20px;margin-top:22px}
.row{display:grid;grid-template-columns:1fr 200px;gap:16px;align-items:center}
.row p{margin:0;font-size:14px}
.meter{position:relative;height:26px}
.meter .t{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--track)}
.meter .lim{position:absolute;top:4px;width:2px;height:18px;background:var(--ink3)}
.meter .dot{position:absolute;top:6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--card)}
.meter .v{position:absolute;right:0;top:-14px;font-size:12px;font-weight:600}
.tag{font-size:12px;color:var(--ink3);text-align:right}
.pace{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--bg);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.tile span{font-size:12px;color:var(--ink2)}
.tile .na{color:var(--ink3)}
.week{display:grid;gap:6px}
.wr{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;align-items:stretch}
.wr.head span{font-size:11px;color:var(--ink3);padding-left:4px}
.day{font-size:13px;font-weight:600;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.day small{font-size:11px;font-weight:400;color:var(--ink3)}
.wr>*{grid-row:1}
.wr.now{background:var(--acc2);border-radius:12px;margin:0 -6px;padding:4px 6px}
.wr.now .day{color:var(--acc)}
.ev{border-radius:9px;padding:7px 9px;min-height:44px;min-width:0;display:flex;flex-direction:column;justify-content:center;
background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.ev b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-size:11px;opacity:.75}
.none{color:var(--ink3);font-size:13px;grid-column:2/-1;align-self:center}
.foot{font-size:11px;color:var(--ink3);text-align:right}
@media (max-width:600px){.row{grid-template-columns:1fr}.pace{grid-template-columns:1fr 1fr 1fr}.tile b{font-size:20px}
.wr.head{display:none}.wr{grid-template-columns:1fr;border-top:1px solid var(--line);padding-top:6px}
.wr>*{grid-row:auto}.wr .ev{grid-column:auto!important;min-height:0;flex-direction:row;justify-content:space-between}.none{grid-column:auto}}
</style></head><body><div class="wrap">
<section class="card"><div class="hero"><b class="num">D-53</b>

70" y="38" font-size="12" font-weight="700" text-anchor="end" fill="var(--ink)">수능 11/19</text><rect x="271.7" y="18" width="68" height="24" rx="12" fill="var(--acc)"/><text x="305.7" y="35" font-size="12.5" font-weight="700" text-anchor="middle" fill="#fff">D-53</text><line x1="305.7" y1="42" x2="305.7" y2="70" stroke="var(--acc)" stroke-width="2"/><circle cx="305.7" cy="76" r="10" fill="var(--acc)" stroke="var(--card)" stroke-width="3"/></svg><div class="lap"><strong>2구간 · 공략법 착수</strong><span class="num">9/21 – 10/4 · 7/14일 · 7일 남음</span></div><div class="bar"><i style="width:50%"></i></div><div class="crit"><div class="row"><p>외운 방법론을 실제 문항에 적용하는 훈련</p><div class="tag">기록으로 재지 않는 목표</div></div><div class="row"><p>수학 &#x27;시간&#x27; 코드 주 3건 이하</p><div class="meter"><span class="v" style="color:var(--good)">이번 주 0건 / 한도 3</span><div class="t"></div><div class="lim" style="left:50.0%"></div><div class="dot" style="left:0.0%;background:var(--good)"></div></div></div></div></section>
<section class="card"><h2>페이스</h2><div class="pace"><div class="tile"><b class="num">0 / 12</b><span>예제 이번 주</span></div><div class="tile"><b class="num">10</b><span>밀린 예제</span></div><div class="tile"><b class="num na">계산불가</b><span>이번 주 이행률</span></div></div></section>
<section class="card"><h2>이번 주 할 일 · 9/28 – 10/3</h2><p class="none" style="margin:0">배정표 없음 — 서명된 주는 2026-09-21</p></section>

</div></body></html>
