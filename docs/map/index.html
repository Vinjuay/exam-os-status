<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>METHOD 지도</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&display=swap">
<style>
/* METHOD 지도 — three views of one data set (graph.js): A 진입 흐름도 (entry pages: question → action → card chips),
   B 단서 → 행동 표 (one row per card), C 포스터 (과목 › 갈래 › 절 rows × 풀이 단계 lanes › 카드, panned and zoomed by a
   single CSS transform). Poster zoom bands (data-z on <html>) only toggle visibility, so nothing reflows while zooming.
   Colour: the six 과목 hues on quiet cool neutrals; 오답 heat is one red luminance ramp; UI chrome stays ink-monochrome;
   View A adds four fixed meanings (단서 blue · 행동 graphite · 함정 red · 예시 green) used for nothing else there.
   Type: the device's Korean system face (what Notion uses on iPad); the 에바 skin adds one webfont (Noto Serif KR 900) only on headings
   whose width no script measures, so a late font swap never moves the poster, tree or flow layout. */
:root {
  --bg: #e9ebef; --fg: #171b21; --muted: #5c6673; --line: #cdd3db; --block: #f6f7f9; --card: #ffffff;
  --ink: #1f2630; --ink-fg: #ffffff; --danger: #c62828; --focus: #1f2630;
  --h1: #fbe3e0; --h2: #f3b2ab; --h3: #dd6b60;
  --c-국어: #af52de; --c-수학: #0a84ff; --c-영어: #30b158; --c-세계지리: #a2845e; --c-사회문화: #ff9500; --c-범과목: #6e7681;
  --cue: #0a6fe0; --act: #1f2630; --trap: #c62828; --ex: #2a9d4f;
  --ctl: #6b7685; --ex-bg: #1e7a3b; --ex-on: #ffffff; --cue-t: color-mix(in srgb, #0a6fe0 82%, #171b21);
  --font: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171c; --fg: #e4e8ee; --muted: #9aa4b2; --line: #2b323c; --block: #1b1f26; --card: #232931;
  --ink: #e4e8ee; --ink-fg: #14171c; --danger: #ff6b6b; --focus: #e4e8ee;
  --h1: #4b2a28; --h2: #7d3b35; --h3: #b84a40; --c-범과목: #8b949e; --cue: #6cb2ff; --act: #e4e8ee; --trap: #ff6b6b; --ex: #4cd964; --ctl: #707b8b; --ex-bg: #4cd964; --ex-on: #14171c; --cue-t: #6cb2ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14171c; --fg: #e4e8ee; --muted: #9aa4b2; --line: #2b323c; --block: #1b1f26; --card: #232931;
  --ink: #e4e8ee; --ink-fg: #14171c; --danger: #ff6b6b; --focus: #e4e8ee;
  --h1: #4b2a28; --h2: #7d3b35; --h3: #b84a40; --c-범과목: #8b949e; --cue: #6cb2ff; --act: #e4e8ee; --trap: #ff6b6b; --ex: #4cd964; --ctl: #707b8b; --ex-bg: #4cd964; --ex-on: #14171c; --cue-t: #6cb2ff; color-scheme: dark }
/* 10-09 에반게리온 스킨 (우뢰): 지도 안 색(과목·오답 열·카드·단서/함정 · 라이트/다크 둘 다)은 위 원래 값 그대로.
   스킨 = 위 막대·보기 머리줄(항상 에바 다크) · 큰 지도/구조 바탕의 육각 격자 · 제목 글씨 · 테두리 · 조작 버튼 */
:root { --eva: #7a4bc0; --go: #a6f26b; --go-fg: #0c0a12; --warn: #ff8a1f;
  --title: "Noto Serif KR", "AppleMyungjo", "Batang", serif; }   /* title-card serif — only on headings whose width no script measures */
#bar, .va-h, #hud, #fit { --bg: #0f0c16; --fg: #ece6f5; --muted: #a89cbd; --line: #33294a; --block: #15111f; --card: #1d1829; --ctl: #6e5f8a;
  --ink: #ece6f5; --ink-fg: #0f0c16; --danger: #ff6b6b; --focus: #a6f26b; color: var(--fg); color-scheme: dark; }
.va-h { background: var(--block); }
::selection { background: var(--go); color: var(--go-fg); }
html { scrollbar-color: var(--ctl) var(--bg); }
input { caret-color: var(--go); }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:is(button, a, input):focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---- poster ---- */
#view { position: fixed; inset: 0; touch-action: none; cursor: grab; overflow: hidden; }
#view:active { cursor: grabbing; }
#poster { position: absolute; left: 0; top: 0; width: max-content; transform-origin: 0 0; will-change: transform;
  display: grid; grid-template-columns: repeat(3, max-content); gap: 260px; padding: 260px; align-items: start; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges path, .flow path { fill: none; stroke: var(--ink); stroke-width: 3; vector-effect: non-scaling-stroke; }
.flow path { stroke: var(--muted); stroke-width: 2; }
marker path { fill: var(--ink); stroke: none; }
.flow marker path { fill: var(--muted); }

.subj { position: relative; min-width: 1200px; min-height: 720px; --tint: color-mix(in srgb, var(--sc) 9%, var(--block));
  background: var(--tint); border: 4px solid var(--sc); border-radius: 36px; padding: 44px 52px 60px;
  display: grid; gap: 40px; align-content: start; justify-items: start; }
.subj-h { display: grid; gap: 10px; }
.subj-h h1 { margin: 0; font-size: 56px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; color: color-mix(in srgb, var(--sc) 72%, var(--fg)); }
.heat { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.heat.sub { font-size: 20px; font-weight: 500; color: var(--muted); }
.far { position: absolute; inset: 0; display: grid; place-content: center; gap: 0.25em; text-align: center; pointer-events: none; padding: 40px; }
.far-l { font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: color-mix(in srgb, var(--sc) 55%, var(--fg)); opacity: 0.92; }   /* hue pulled toward the text colour: raw 과목 hues were 1.8–2.5:1 on the light tints, large text needs 3:1 */
.far-s { font-weight: 600; justify-self: center; padding: 0.2em 0.6em; border-radius: 0.4em; background: var(--card); font-variant-numeric: tabular-nums; }
.far-s[data-h="1"] { background: var(--h1); } .far-s[data-h="2"] { background: var(--h2); } .far-s[data-h="3"] { background: var(--h3); }

.shelf { display: flex; flex-wrap: wrap; gap: 14px 36px; max-width: 3100px; }
.shelf-g { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.shelf-g b { font-size: 16px; color: var(--muted); margin-right: 4px; }
.pg { font-size: 15px; line-height: 1.25; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); max-width: 420px; }

.subj-b { display: grid; grid-template-columns: max-content 1fr; gap: 36px; align-items: start; }
.subj-b.nos { grid-template-columns: 1fr; }
.spine { width: 300px; display: grid; gap: 2px; align-content: start; font-size: 14px; line-height: 1.3; padding-top: 6px; }
.spine b { font-size: 17px; margin: 0 0 6px; color: var(--muted); }
.ol { padding: 4px 8px 4px calc(8px + var(--d, 0) * 18px); border-radius: 6px; }
.ol.d1 { font-weight: 700; font-size: 15px; } .ol.d3 { color: var(--muted); }
.ol.has::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sc); margin-right: 7px; vertical-align: 2px; }
.ol.on { background: var(--ink); color: var(--ink-fg); }
.branches { display: flex; flex-wrap: wrap; gap: 40px; max-width: 3200px; align-items: flex-start; }

.br { position: relative; background: var(--block); border: 2px solid var(--line); border-radius: 24px; padding: 28px 30px 34px; display: grid; gap: 22px; align-content: start; }
.br-h { display: grid; gap: 8px; }
.br-h h2 { margin: 0; font-size: 64px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; color: color-mix(in srgb, var(--sc) 60%, var(--fg)); }
.br-h .heat { font-size: 30px; }
.cnt { font-size: 20px; color: var(--muted); }
/* band-1 overlay: 갈래 name + its top-3 heat cards, floating over the lanes (no reflow) */
.br-far { position: absolute; inset: 0; display: grid; place-content: center; gap: 0.2em; text-align: center; pointer-events: none; padding: 40px; visibility: hidden; }
.br-far .far-s { display: block; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0.15em auto 0; }
.lanesets { display: flex; gap: 40px; align-items: flex-start; }
.lanes { display: grid; gap: 14px; align-items: start; }
.lane-h { font-size: 15px; font-weight: 600; color: var(--muted); padding: 0 2px 4px; border-bottom: 2px solid var(--line); }
.sec-h { grid-column: 1 / -1; padding-top: 10px; border-top: 3px solid var(--sc); }
.sec-h.none { border-top-color: var(--line); }
.sec-h h3 { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 700; }
.sec-h .chips { margin-top: 6px; }
.sec-h.none h3 { color: var(--muted); font-weight: 500; }
.cell { display: grid; grid-template-columns: repeat(var(--cols, 1), 280px); gap: 10px; align-content: start; align-items: start; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; display: grid; gap: 6px;
  align-content: start; width: 280px; box-sizing: border-box; font-size: 13px; line-height: 1.35; }
.card[data-h="1"] { background: var(--h1); } .card[data-h="2"] { background: var(--h2); } .card[data-h="3"] { background: var(--h3); }
.hide-fact .card.fact { display: none; }
.card .lb { font-size: 16px; line-height: 1.3; font-weight: 600; }
.dot { font-style: normal; color: var(--muted); margin-left: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.chip.mk { border-color: var(--muted); }
.chip.rt { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.chip.ai { border-style: dashed; color: var(--muted); }
.chip.warn { color: var(--danger); border-color: var(--danger); }
.card .body { display: grid; gap: 4px; }
.card .body p { margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.card .body p[data-f="절차"], .card .body p[data-f="칸"] { -webkit-line-clamp: 3; }
.card .body b { font-weight: 600; color: var(--muted); font-size: 11.5px; margin-right: 5px; }
.none { color: var(--muted); font-style: normal; }
.card.ct { width: 420px; }
.sel { outline: 4px solid var(--ink); outline-offset: 3px; }
.rel { outline: 4px dashed var(--ink); outline-offset: 3px; }
.dim { opacity: 0.18; }

.units { display: flex; flex-wrap: wrap; gap: 24px; max-width: 3100px; align-items: flex-start; }
.grp { flex-basis: 100%; font-size: 22px; font-weight: 700; color: color-mix(in srgb, var(--sc) 60%, var(--fg)); padding-top: 8px; }
.unit { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 18px; display: grid; gap: 10px; align-content: start; width: 456px; box-sizing: border-box; }
.unit h3 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; }
.unit h3 .chip { vertical-align: middle; margin-left: 6px; }
.unit .meta { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
.unit .meta p { margin: 0; white-space: pre-line; }
.unit .meta .ex::before { content: "예제 "; font-weight: 600; }
.unit .rows { display: grid; gap: 8px; }
.unit .card { background: var(--block); }

.flow { position: relative; font-size: 13px; line-height: 1.25; }
.flow svg { position: absolute; left: 0; top: 0; overflow: visible; }
.fgrp { position: absolute; box-sizing: border-box; border: 2px dashed color-mix(in srgb, var(--sc) 50%, var(--line)); border-radius: 14px; }
.fgrp b { position: absolute; left: 12px; top: 6px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.fnode { position: absolute; box-sizing: border-box; padding: 8px 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px;
  text-align: center; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.flbl { position: absolute; transform: translate(-50%, -50%); width: 150px; font-size: 11.5px; line-height: 1.25; text-align: center;
  color: var(--muted); background: var(--tint); padding: 2px 4px; border-radius: 4px; pointer-events: none; }

/* zoom bands (k thresholds .18 / .32 / .8): 0 과목 · 1 갈래 · 2 절·카드 제목 · 3 카드 본문 (visibility only — no reflow) */
[data-z="0"] .subj > :not(.far) { visibility: hidden; }
:root:not([data-z="0"]) .far { visibility: hidden; }
[data-z="1"] :is(.lane-h, .sec-h, .spine, .grp, .unit > h3, .unit > .meta, .card > *, .br-h) { visibility: hidden; }   /* boxes + heat tints stay */
[data-z="1"] .br-far { visibility: visible; }
[data-z="2"] .card .body { visibility: hidden; }

/* ---- fixed chrome ---- */
#bar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: grid; gap: 2px; padding: calc(3px + env(safe-area-inset-top, 0px)) 12px 3px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { font-weight: 800; font-size: 15px; white-space: nowrap; }
.tabs { display: flex; gap: 0; padding: 0; border: 1px solid var(--ctl); border-radius: 10px; background: var(--card); flex: none; }
.tabs button { height: 44px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); }
.ribbon { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: var(--danger); color: var(--ink-fg); white-space: nowrap; }
#q::placeholder { color: var(--muted); opacity: 1; }   /* UA default #757575 is 3.2:1 on the dark field */
#q { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--ctl); border-radius: 10px; background: var(--card); padding: 0 12px; font-size: 16px; }
.fbar { display: flex; align-items: center; gap: 6px; padding: 4px 4px; margin: -4px -4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.fbar::-webkit-scrollbar { display: none; }
.fbar > * { flex: none; }   /* a scroller: chips keep their width instead of squeezing into each other at phone width */
.fbar .gl { font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-left: 6px; }
.fbar .n { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fchip { height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--ctl); background: var(--card); white-space: nowrap; font-size: 13.5px; }
.fchip small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.fchip[aria-pressed="true"], .fchip.clr { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.fchip[aria-pressed="true"] small { color: inherit; opacity: 0.8; }
#res { position: absolute; left: 12px; right: 12px; top: 100%; margin-top: 4px; max-height: 50vh; overflow: auto; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); display: grid; padding: 4px; }
#res button { text-align: left; background: none; border: 0; min-height: 44px; padding: 8px 10px; border-radius: 8px; display: grid; gap: 2px; }
#res button:hover { background: var(--bg); }
#res small, #res .empty { color: var(--muted); font-size: 12px; }
#res .empty { padding: 12px; font-size: 14px; }
@media (max-width: 479px) { .brand { display: none; } .tabs button { padding: 0 8px; font-size: 13px; } }

#hud { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
  font-size: 12px; color: var(--muted); background: var(--block); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; max-width: calc(100vw - 150px); }
#hud.old #hud-t { color: var(--danger); font-weight: 700; }
#hud button { height: 44px; min-width: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--danger); background: none; color: var(--danger); font-size: 12px; font-weight: 600; }
#fit { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; height: 44px; padding: 0 16px; border-radius: 12px; border: 0;
  background: var(--ink); color: var(--ink-fg); font-weight: 700; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--ink-fg); padding: 10px 16px; border-radius: 10px; font-weight: 600; }
.fail { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; text-align: center; font-size: 18px; padding: 24px; background: var(--bg); }

/* ---- View A: 진입 흐름도 ---- */
#va { position: fixed; top: var(--barh, 96px); left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
.va-h { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; padding: 4px 16px; border-bottom: 1px solid var(--line); background: var(--block); }
.va-h h1 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 800; letter-spacing: -0.01em; }
.va-h .meta { flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); }
.va-h .pn { font-weight: 700; color: var(--fg); }
.va-h .cnt { font-size: 13px; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; border: 1px dashed var(--danger); color: var(--danger); white-space: nowrap; }
.sm { height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--ctl); background: var(--card); font-size: 12.5px; color: var(--muted); }
.sm[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.sm.warn { color: var(--danger); border-color: var(--danger); font-weight: 600; }
.va-body { position: relative; flex: 1; min-height: 0; }
#va-z { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#va-z:active { cursor: grabbing; }
#va-d { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; font-size: 13px; line-height: 1.3; }
#va-d svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#va-d svg path { fill: none; stroke: var(--muted); stroke-width: 2; }
#va-d svg path.trap { stroke: var(--trap); }
#va-d svg path.back { stroke-dasharray: 7 5; }
#va-d marker path { fill: var(--muted); stroke: none; }
#va-d marker.trap path { fill: var(--trap); }
.vn { position: absolute; box-sizing: border-box; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; justify-items: center; gap: 6px; text-align: center; cursor: pointer; overflow: visible; }
.vn .t { white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.vn.on { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 10px; }
.vn.q::before, .vn.q::after { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); z-index: -1; }
.vn.q::before { background: var(--cue); }
.vn.q::after { inset: 2.5px; background: color-mix(in srgb, var(--cue) 12%, var(--card)); }
.vn.q { padding: 14px 0; }
.vn.q .t { width: 66%; -webkit-line-clamp: 3; font-size: 12.5px; line-height: 1.2; font-weight: 600; color: color-mix(in srgb, var(--cue) 75%, var(--fg)); }
.vn.a { padding: 8px 10px; background: var(--card); border: 1.5px solid var(--act); border-radius: 10px; min-height: 84px; }
.vn.a .t { font-weight: 600; color: var(--act); }
.vn.r { padding: 6px 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 40px; }
.vn.r .t { -webkit-line-clamp: 2; }
.vn.x { padding: 10px 26px; min-height: 84px; }
