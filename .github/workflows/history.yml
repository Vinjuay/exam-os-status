name: history

# 자동화 #4 — docs/index.html은 매번 덮어써져서 추세가 git history에만 갇힌다.
# 하루 한 번 history 전체를 훑어 시계열 두 벌을 다시 만들고, 변한 게 있으면 커밋한다.
on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 04:00 KST — 로컬 생성 스크립트가 조용한 시간
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 시계열을 history 전체에서 다시 만들기 때문에 필요하다

      - name: 시계열 재생성
        run: python3 .github/scripts/build_history.py

      - name: 변경분 커밋
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # 첫 실행에서는 두 파일이 아직 추적 대상이 아니다. git diff는 미추적
          # 파일을 보지 못하므로 먼저 stage한 뒤 인덱스를 비교한다.
          git add docs/history.ndjson docs/history-daily.ndjson
          if git diff --cached --quiet -- docs/history.ndjson docs/history-daily.ndjson; then
            echo "변경 없음 — 커밋하지 않습니다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "history: 지표 시계열 갱신"
          # 로컬 생성 스크립트가 같은 순간에 밀어 넣을 수 있으므로 리베이스 후 재시도한다.
          for attempt in 1 2 3; do
            if git push origin HEAD:"$BRANCH"; then
              echo "푸시 완료 (시도 $attempt)"
              exit 0
            fi
            echo "푸시 실패 — 리베이스 후 재시도 ($attempt)"
            git pull --rebase origin "$BRANCH"
          done
          echo "3회 시도 후에도 푸시하지 못했습니다" >&2
          exit 1
